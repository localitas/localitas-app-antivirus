services:
  web:
    image: ghcr.io/localitas/localitas-app-antivirus:latest
    command: ["serve", "--listen", ":8000", "--base-path", "/apps/ext/antivirus/", "--clamd-socket", "/var/run/clamav/clamd.sock"]
    ports:
      - "${APP_PORT:-9211}:8000"
    environment:
      - CORE_URL=http://host.docker.internal:8090
      - LOCALITAS_API_TOKEN=${LOCALITAS_API_TOKEN:-}
      - LOCALITAS_DATA_DIR=${HOME}/.localitas
    volumes:
      - ${HOME}/.localitas/clamav/clamd.sock:/var/run/clamav/clamd.sock
    user: "0:0"
    labels:
      localitas.app: "true"
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
