{{define "index.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antivirus — Localitas</title>
    <base href="{{.BasePath}}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --sidebar-w: 260px; --color-bg-base: #fcfbfe; --color-bg-elevated: #f0eef7; --color-text-primary: #1a1625; --color-text-secondary: #4a3f5c; --color-glass-base: rgba(255,255,255,0.75); --color-glass-border: rgba(139,117,169,0.35); --color-accent: #7d6b96; --color-green: #10b981; --color-red: #ef4444; --shadow: 0 4px 16px rgba(139,117,169,0.08); }
        [data-theme="dark"] { --color-bg-base: #120f1a; --color-bg-elevated: #221b2e; --color-text-primary: #e8e4f0; --color-text-secondary: #b3a8c8; --color-glass-base: rgba(37,31,53,0.85); --color-glass-border: rgba(184,164,212,0.15); --color-accent: #c5b3e0; --color-green: #4ade80; --color-red: #f87171; --shadow: 0 6px 24px rgba(0,0,0,0.4); }
        html, body { margin:0; padding:0; height:100%; overflow:hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--color-bg-base); color: var(--color-text-primary); display:flex; }
        .bg { position:fixed; inset:0; background: radial-gradient(circle at 10% 20%, var(--color-bg-elevated), var(--color-bg-base) 90%); z-index:-1; }

        .sidebar { width:var(--sidebar-w); min-width:200px; flex-shrink:0; border-right:1px solid var(--color-glass-border); display:flex; flex-direction:column; background:var(--color-glass-base); }
        .sidebar-header { height:56px; min-height:56px; padding:0 0.75rem; display:flex; align-items:center; gap:0.5rem; border-bottom:1px solid var(--color-glass-border); font-weight:600; font-size:0.9375rem; }
        .sidebar-nav { flex:1; overflow-y:auto; padding:0.5rem; }
        .nav-item { display:flex; align-items:center; gap:0.75rem; padding:0.625rem 0.75rem; cursor:pointer; font-size:0.8125rem; border-radius:0.375rem; margin-bottom:0.125rem; color:var(--color-text-secondary); }
        .nav-item:hover { background:rgba(142,122,168,0.15); color:var(--color-text-primary); }
        .nav-item.active { background:rgba(168,85,247,0.15); color:var(--color-text-primary); font-weight:500; }
        .sidebar-stats { padding:0.75rem; border-top:1px solid var(--color-glass-border); }
        .stat-row { display:flex; justify-content:space-between; font-size:0.75rem; padding:0.25rem 0; }
        .stat-label { color:var(--color-text-secondary); }
        .stat-value { font-weight:600; }

        .main { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
        .toolbar { height:56px; min-height:56px; padding:0 1rem; display:flex; align-items:center; gap:0.5rem; border-bottom:1px solid var(--color-glass-border); background:var(--color-glass-base); }
        .content-area { flex:1; overflow-y:auto; padding:1.5rem; }

        .btn { padding:0.375rem 0.75rem; border-radius:0.5rem; border:1px solid var(--color-glass-border); background:var(--color-glass-base); color:var(--color-text-primary); cursor:pointer; font-size:0.8125rem; display:inline-flex; align-items:center; gap:0.25rem; }
        .btn:hover { border-color:var(--color-accent); }
        .btn-primary { background:var(--color-accent); color:var(--color-bg-elevated); border-color:var(--color-accent); }

        .upload-zone { border:2px dashed var(--color-glass-border); border-radius:0.75rem; padding:3rem; text-align:center; cursor:pointer; transition:border-color 0.2s; }
        .upload-zone:hover, .upload-zone.dragover { border-color:var(--color-accent); background:rgba(142,122,168,0.05); }
        .scan-item { display:flex; align-items:center; gap:0.75rem; padding:0.75rem 1rem; border-bottom:1px solid var(--color-glass-border); font-size:0.8125rem; }
        .scan-item:last-child { border-bottom:none; }
        .verdict-clean { color:var(--color-green); }
        .verdict-infected { color:var(--color-red); }
        .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
        .status-dot.running { background:var(--color-green); }
        .status-dot.stopped { background:var(--color-red); }

        @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        @media (max-width: 768px) {
            .sidebar { position:fixed; left:0; top:0; bottom:0; z-index:100; transform:translateX(-100%); transition:transform 0.3s; }
            .sidebar.visible { transform:translateX(0); }
        }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="sidebar" id="av-sidebar">
        <div class="sidebar-header">
            <i data-lucide="shield-check" style="width:18px;height:18px;display:inline;color:var(--color-accent);"></i> Antivirus
        </div>
        <div class="sidebar-nav">
            <div class="nav-item active" onclick="showView('scan')">
                <i data-lucide="upload" style="width:16px;height:16px;display:inline;"></i> Scan File
            </div>
            <div class="nav-item" onclick="showView('history')">
                <i data-lucide="clock" style="width:16px;height:16px;display:inline;"></i> Scan History
            </div>
            <div class="nav-item" onclick="showView('docs')">
                <i data-lucide="book-open" style="width:16px;height:16px;display:inline;"></i> Documentation
            </div>
        </div>
        <div class="sidebar-stats">
            <div style="font-size:0.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-secondary);margin-bottom:0.5rem;">Status</div>
            <div id="sidebar-clamd" style="font-size:0.75rem;margin-bottom:0.5rem;"></div>
            <div class="stat-row"><span class="stat-label">Total Scans</span><span class="stat-value" id="stat-total">0</span></div>
            <div class="stat-row"><span class="stat-label">Clean</span><span class="stat-value verdict-clean" id="stat-clean">0</span></div>
            <div class="stat-row"><span class="stat-label">Threats</span><span class="stat-value verdict-infected" id="stat-threats">0</span></div>
        </div>
    </div>

    <div class="main">
        <div class="toolbar">
            <button class="btn" style="display:none;" id="menu-btn" onclick="document.getElementById('av-sidebar').classList.toggle('visible')"><i data-lucide="menu" style="width:20px;height:20px;display:inline;"></i></button>
            <span id="toolbar-title" style="font-weight:600;font-size:1rem;">Scan File</span>
            <span style="flex:1;"></span>
            <button class="btn" onclick="loadStatus()"><i data-lucide="refresh-cw" style="width:14px;height:14px;display:inline;"></i> Refresh</button>
        </div>
        <div class="content-area" id="content-area"></div>
    </div>

    <script>
        (function() {
            var html = document.documentElement;
            html.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            window.addEventListener('message', function(e) { if (e.data && e.data.type === 'theme-change') html.setAttribute('data-theme', e.data.theme); });
            if (window.innerWidth <= 768) document.getElementById('menu-btn').style.display = '';
        })();

        var currentView = 'scan';

        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
            if (new URLSearchParams(window.location.search).get('docs') === 'true') {
                showView('docs');
            } else {
                showView('scan');
            }
            loadStatus();
        });

        function showView(view) {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(function(el, i) {
                el.classList.toggle('active', (view === 'scan' && i === 0) || (view === 'history' && i === 1) || (view === 'docs' && i === 2));
            });

            var titles = {scan: 'Scan File', history: 'Scan History', docs: 'Documentation'};
            document.getElementById('toolbar-title').textContent = titles[view] || view;

            if (view === 'scan') renderScanView();
            else if (view === 'history') renderHistoryView();
            else if (view === 'docs') renderDocsView();
        }

        function renderScanView() {
            var content = document.getElementById('content-area');
            content.innerHTML =
                '<div class="upload-zone" id="upload-zone" onclick="document.getElementById(\'file-input\').click()">' +
                '<i data-lucide="upload" style="width:48px;height:48px;display:block;margin:0 auto 1rem;color:var(--color-accent);"></i>' +
                '<p style="font-size:1rem;font-weight:600;margin-bottom:0.5rem;">Drop files here or click to upload</p>' +
                '<p style="font-size:0.8125rem;color:var(--color-text-secondary);">Files are scanned with ClamAV before being stored</p>' +
                '<input type="file" id="file-input" style="display:none;" multiple onchange="scanFiles(this.files)">' +
                '</div>' +
                '<div id="scan-progress" style="display:none;margin-bottom:1rem;padding:0.75rem;border-radius:0.5rem;background:var(--color-glass-base);border:1px solid var(--color-glass-border);">' +
                '<div style="display:flex;align-items:center;gap:0.5rem;">' +
                '<i data-lucide="loader" style="width:16px;height:16px;display:inline;animation:spin 1s linear infinite;"></i>' +
                '<span id="scan-progress-text" style="font-size:0.8125rem;">Scanning...</span>' +
                '</div></div>' +
                '<div id="recent-scans"></div>';
            lucide.createIcons();
            initDragDrop();
            loadRecentScans();
        }

        function renderHistoryView() {
            var content = document.getElementById('content-area');
            content.innerHTML = '<div id="history-list" style="background:var(--color-glass-base);border:1px solid var(--color-glass-border);border-radius:0.75rem;overflow:hidden;"></div>';
            loadHistory();
        }

        function renderDocsView() {
            var content = document.getElementById('content-area');
            content.innerHTML = '<div style="color:var(--color-text-secondary);">Loading documentation...</div>';
            fetch('/apps/antivirus/help?format=html')
                .then(function(r) { return r.text(); })
                .then(function(html) {
                    content.innerHTML = html;
                    lucide.createIcons();
                });
        }

        function helpShowSwagger() {
            var w = document.getElementById('help-wrapper');
            if (!w) return;
            var swaggerUrl = w.dataset.swaggerUrl;
            w.innerHTML = '<div style="display:flex;flex-direction:column;flex:1;min-height:0;">'
                + '<div style="padding:0.5rem 1rem;border-bottom:1px solid var(--color-glass-border);display:flex;align-items:center;gap:0.75rem;">'
                + '<a onclick="showView(\'docs\')" style="color:var(--color-accent);cursor:pointer;font-size:0.8125rem;text-decoration:none;">\u2190 Back to docs</a>'
                + '<span style="font-size:0.8125rem;font-weight:500;color:var(--color-text-primary);">API Documentation</span></div>'
                + '<iframe src="' + swaggerUrl + '" style="flex:1;border:none;width:100%;"></iframe></div>';
        }

        function initDragDrop() {
            var zone = document.getElementById('upload-zone');
            if (!zone) return;
            zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('dragover'); });
            zone.addEventListener('dragleave', function() { zone.classList.remove('dragover'); });
            zone.addEventListener('drop', function(e) {
                e.preventDefault();
                zone.classList.remove('dragover');
                if (e.dataTransfer.files.length) scanFiles(e.dataTransfer.files);
            });
        }

        async function loadStatus() {
            try {
                var resp = await fetch('api/status');
                var status = await resp.json();
                var dot = status.running ? '<span class="status-dot running"></span>' : '<span class="status-dot stopped"></span>';
                var label = status.running ? ' ClamAV running' : ' ClamAV stopped';
                document.getElementById('sidebar-clamd').innerHTML = dot + '<span style="color:var(--color-text-secondary);">' + label + '</span>';
                document.getElementById('stat-total').textContent = status.total_scans;
                document.getElementById('stat-clean').textContent = status.clean_files;
                document.getElementById('stat-threats').textContent = status.threats_found;
            } catch(e) {}
        }

        function loadRecentScans() {
            fetch('api/history?limit=5')
                .then(function(r) { return r.json(); })
                .then(function(results) {
                    var el = document.getElementById('recent-scans');
                    if (!el || !results || !results.length) return;
                    el.innerHTML = '<div style="font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--color-text-secondary);margin-bottom:0.5rem;">Recent Scans</div>' +
                        '<div style="background:var(--color-glass-base);border:1px solid var(--color-glass-border);border-radius:0.75rem;overflow:hidden;">' +
                        results.map(renderScanItem).join('') + '</div>';
                    lucide.createIcons();
                })
                .catch(function() {});
        }

        function loadHistory() {
            fetch('api/history?limit=100')
                .then(function(r) { return r.json(); })
                .then(function(results) {
                    var list = document.getElementById('history-list');
                    if (!list) return;
                    if (!results || !results.length) {
                        list.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--color-text-secondary);font-size:0.875rem;">No scans yet. Upload a file to get started.</div>';
                        return;
                    }
                    list.innerHTML = results.map(renderScanItem).join('');
                    lucide.createIcons();
                })
                .catch(function() {});
        }

        function renderScanItem(r) {
            var icon = r.verdict === 'clean' ? 'check-circle' : 'alert-triangle';
            var cls = r.verdict === 'clean' ? 'verdict-clean' : 'verdict-infected';
            var threat = r.threat_name ? ' — ' + esc(r.threat_name) : '';
            var size = r.file_size > 1048576 ? (r.file_size/1048576).toFixed(1) + ' MB' : (r.file_size/1024).toFixed(0) + ' KB';
            var date = new Date(r.scanned_at).toLocaleString();
            return '<div class="scan-item">' +
                '<i data-lucide="' + icon + '" class="' + cls + '" style="width:18px;height:18px;flex-shrink:0;"></i>' +
                '<div style="flex:1;min-width:0;">' +
                '<div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(r.filename) + '</div>' +
                '<div style="font-size:0.6875rem;color:var(--color-text-secondary);">' + size + ' — ' + r.duration_ms + 'ms' + threat + '</div></div>' +
                '<div style="font-size:0.6875rem;color:var(--color-text-secondary);white-space:nowrap;">' + date + '</div></div>';
        }

        async function scanFiles(fileList) {
            var progress = document.getElementById('scan-progress');
            var progressText = document.getElementById('scan-progress-text');
            if (progress) progress.style.display = '';

            for (var i = 0; i < fileList.length; i++) {
                var f = fileList[i];
                if (progressText) progressText.textContent = 'Scanning ' + f.name + ' (' + (i+1) + '/' + fileList.length + ')...';
                try {
                    var formData = new FormData();
                    formData.append('file', f);
                    var resp = await fetch('api/scan', {method:'POST', body: formData});
                    var result = await resp.json();
                    if (result.error && progressText) {
                        progressText.textContent = 'Error: ' + result.error;
                        await new Promise(function(r) { setTimeout(r, 2000); });
                    }
                } catch(e) {
                    if (progressText) {
                        progressText.textContent = 'Failed: ' + e.message;
                        await new Promise(function(r) { setTimeout(r, 2000); });
                    }
                }
            }

            if (progress) progress.style.display = 'none';
            var fileInput = document.getElementById('file-input');
            if (fileInput) fileInput.value = '';
            loadStatus();
            if (currentView === 'scan') loadRecentScans();
            if (currentView === 'history') loadHistory();
        }

        function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    </script>
</body>
</html>
{{end}}
